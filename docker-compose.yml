# Local development stack
#
# Services:
#   postgres  — PostgreSQL 16 + PostGIS 3.4 (primary datastore)
#   redis     — Redis 7 (spatial index, distributed locks, frame buffers)
#   migrate   — one-shot migration runner (all .up.sql files, then exits)
#   backend   — Go server (built from source via Dockerfile)
#   osrm      — OSRM router over the Rwanda extract in ./data
#
# Usage:
#   cp .env.example .env          # fill in JWT_SECRET
#   docker compose up --build     # first run
#   docker compose up             # subsequent runs
#   docker compose down -v        # destroy volumes (wipes DB)

services:

  # ── PostgreSQL + PostGIS ────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: umurinzi_postgres
    restart: unless-stopped
    # Stress-tested with a 100-connection app pool + background workers;
    # the default 100-connection server limit would exhaust under load.
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_DB:       umurinzi
      POSTGRES_USER:     umurinzi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umurinzi -d umurinzi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  # The password flag is injected via entrypoint substitution so an EMPTY
  # password simply omits --requirepass. A plain `--requirepass ${VAR:-}`
  # collapses the two list items into one and corrupts the next flag
  # (--maxmemory would become the password value).
  redis:
    image: redis:7-alpine
    container_name: umurinzi_redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 256mb \
            --maxmemory-policy allkeys-lru --save "" --appendonly no
        fi
        exec redis-server --maxmemory 256mb \
          --maxmemory-policy allkeys-lru --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG || redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Migrate (one-shot) ──────────────────────────────────────────────────────
  # Runs all .up.sql files in order then exits.
  # Depends on postgres being healthy so it never races the DB.
  migrate:
    image: migrate/migrate:v4.17.1
    container_name: umurinzi_migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command: >
      -path=/migrations
      -database=postgres://umurinzi:${POSTGRES_PASSWORD:-secret}@postgres:5432/umurinzi?sslmode=disable
      up
    restart: on-failure

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umurinzi_backend
    restart: unless-stopped
    # Load testing hit socket collapse at ~1200 concurrent WebSocket drivers on
    # the Docker default soft fd limit (1024). Give the runtime real headroom.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PORT:               ${PORT:-8080}
      SHUTDOWN_TIMEOUT_SECS: ${SHUTDOWN_TIMEOUT_SECS:-30}

      DATABASE_URL:       postgres://umurinzi:${POSTGRES_PASSWORD:-secret}@postgres:5432/umurinzi?sslmode=disable
      DB_MAX_CONNS:       ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS:       ${DB_MIN_CONNS:-5}
      DB_MAX_CONN_LIFETIME_MINS: ${DB_MAX_CONN_LIFETIME_MINS:-30}

      REDIS_ADDR:         redis:6379
      REDIS_PASSWORD:     ${REDIS_PASSWORD:-}
      REDIS_DB:           ${REDIS_DB:-0}

      JWT_SECRET:         ${JWT_SECRET:?JWT_SECRET is required — copy .env.example to .env and set it}
      JWT_EXPIRY_HOURS:   ${JWT_EXPIRY_HOURS:-24}
      BCRYPT_COST:        ${BCRYPT_COST:-12}

      ANOMALY_STATIONARY_MINUTES:  ${ANOMALY_STATIONARY_MINUTES:-5}
      ANOMALY_DEVIATION_METERS:    ${ANOMALY_DEVIATION_METERS:-300}
      ANOMALY_PANIC_BUFFER_SIZE:   ${ANOMALY_PANIC_BUFFER_SIZE:-30}

      # OSRM runs as a sibling service — must override the localhost default
      # or the matching engine silently degrades to haversine estimates.
      OSRM_BASE_URL:      ${OSRM_BASE_URL:-http://osrm:5000}
      OSRM_TIMEOUT_MS:    ${OSRM_TIMEOUT_MS:-3000}

      # Matching engine tuning (defaults mirror config.go).
      MATCH_WEIGHT_TIME:     ${MATCH_WEIGHT_TIME:-3.0}
      MATCH_WEIGHT_DISTANCE: ${MATCH_WEIGHT_DISTANCE:-1.0}
      MATCH_WEIGHT_FUEL:     ${MATCH_WEIGHT_FUEL:-0.5}
      MATCH_BATCH_WINDOW_MS: ${MATCH_BATCH_WINDOW_MS:-12000}
      MATCH_REDISPATCH_TIMEOUT_MS: ${MATCH_REDISPATCH_TIMEOUT_MS:-45000}

      MATCH_RADIUS_MOTORCYCLE_KM: ${MATCH_RADIUS_MOTORCYCLE_KM:-3.0}
      MATCH_RADIUS_CAR_KM:        ${MATCH_RADIUS_CAR_KM:-5.0}
      MATCH_RADIUS_VAN_KM:        ${MATCH_RADIUS_VAN_KM:-7.0}
      MATCH_RADIUS_TRUCK_KM:      ${MATCH_RADIUS_TRUCK_KM:-10.0}

      MATCH_MAX_DEADHEAD_MOTORCYCLE_KM: ${MATCH_MAX_DEADHEAD_MOTORCYCLE_KM:-3.0}
      MATCH_MAX_DEADHEAD_CAR_KM:        ${MATCH_MAX_DEADHEAD_CAR_KM:-6.0}
      MATCH_MAX_DEADHEAD_VAN_KM:        ${MATCH_MAX_DEADHEAD_VAN_KM:-10.0}
      MATCH_MAX_DEADHEAD_TRUCK_KM:      ${MATCH_MAX_DEADHEAD_TRUCK_KM:-15.0}

      FUEL_L_PER_KM_MOTORCYCLE: ${FUEL_L_PER_KM_MOTORCYCLE:-0.035}
      FUEL_L_PER_KM_CAR:        ${FUEL_L_PER_KM_CAR:-0.080}
      FUEL_L_PER_KM_VAN:        ${FUEL_L_PER_KM_VAN:-0.120}
      FUEL_L_PER_KM_TRUCK:      ${FUEL_L_PER_KM_TRUCK:-0.250}
      FUEL_PRICE_RWF_PER_LITRE: ${FUEL_PRICE_RWF_PER_LITRE:-1550.0}

      MATCH_HEADING_PENALTY_THRESHOLD_DEG: ${MATCH_HEADING_PENALTY_THRESHOLD_DEG:-90.0}
      MATCH_HEADING_PENALTY_MIN_SPEED_KMH: ${MATCH_HEADING_PENALTY_MIN_SPEED_KMH:-30.0}
      MATCH_HEADING_PENALTY_MULTIPLIER:    ${MATCH_HEADING_PENALTY_MULTIPLIER:-1.8}

      MATCH_MAX_STACK_DELAY_MINUTES: ${MATCH_MAX_STACK_DELAY_MINUTES:-5.0}
      MATCH_MAX_STACK_DIRECTION_DEG: ${MATCH_MAX_STACK_DIRECTION_DEG:-45.0}
      MATCH_PREMIUM_SCORE_BOOST:     ${MATCH_PREMIUM_SCORE_BOOST:-10.0}
    ports:
      - target: 8080
        published: ${PORT:-8080}
        protocol: tcp
        mode: host
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── OSRM ────────────────────────────────────────────────────────────────────
  # Pre-processes the Rwanda OSM extract on first run (extract → partition →
  # customize), then serves the routing API. First start can take several
  # minutes — the backend's OSRM client fails soft (haversine fallback) while
  # osrm-extract is still running.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: osrm-backend
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    restart: unless-stopped
    command: >
      sh -c "if [ ! -f /data/rwanda-260926.osrm ]; then
               osrm-extract -p /opt/car.lua /data/rwanda-260926.osm.pbf &&
               osrm-partition /data/rwanda-260926.osrm &&
               osrm-customize /data/rwanda-260926.osrm;
             fi &&
             osrm-routed --algorithm mld /data/rwanda-260926.osrm"

volumes:
  postgres_data:
    driver: local
